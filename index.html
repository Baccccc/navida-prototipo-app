<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#fafbfc">
  <title>Navida — Prototipo</title>
  <meta name="description" content="Prototipo interattivo dell'app Navida.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css?v=20260903-menu">
  <link rel="stylesheet" href="css/app.css?v=20260903-menu">
  <link rel="stylesheet" href="css/percorso.css?v=20260903-menu">
  <link rel="stylesheet" href="css/career-variants.css?v=20260903-menu">
  <link rel="stylesheet" href="css/space-journey.css?v=20260903-menu">
  <link rel="stylesheet" href="css/wow.css?v=20260903-menu">
  <link rel="stylesheet" href="css/editor.css?v=20260903-menu">
  <link rel="stylesheet" href="css/commenti.css?v=20260903-menu">
</head>
<body>

  <!-- Salto rapido: invisibile finché non premi Tab -->
  <button id="skip" class="skiplink">Salta al questionario</button>

  <div id="stage">
    <div class="device">
      <div class="device__notch"></div>
      <div class="device__status">
        <span>9:41</span>
        <span class="status-icons" id="statusIcons"></span>
      </div>

      <main id="app"></main>

      <div class="device__home"></div>
    </div>
  </div>

  <!-- Commenti del team: foglietti a sinistra dello schermo -->
  <aside id="commenti" class="is-vuoto"></aside>

  <!-- Barra di modifica: pannello laterale, fuori dallo schermo del telefono -->
  <aside id="editor"></aside>

  <!-- Icone Lucide: geometria incorporata in js/icons.js, così il prototipo
       funziona anche offline. Il CDN copre le eventuali icone non incorporate. -->
  <script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js"></script>

  <script src="js/icons.js?v=20260903-menu"></script>
  <script src="js/content.js?v=20260903-menu"></script>
  <script src="js/data-professioni.js?v=20260903-menu"></script>
  <script src="js/variants.js?v=20260903-menu"></script>
  <script src="js/mascotte.js?v=20260903-menu"></script>
  <script src="js/percorso.js?v=20260903-menu"></script>
  <script src="js/state.js?v=20260903-menu"></script>
  <script src="js/sync.js?v=20260903-menu"></script>
  <script src="js/render.js?v=20260903-menu"></script>
  <script src="js/keyboard.js?v=20260903-menu"></script>
  <script src="js/wow.js?v=20260903-menu"></script>
  <script src="js/commenti.js?v=20260903-menu"></script>
  <script src="js/editor.js?v=20260903-menu"></script>
  <script src="js/app.js?v=20260903-menu"></script>
</body>
</html>
